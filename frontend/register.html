<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Connect CSS -->
    <link rel="stylesheet" href="style.css">

    <title>Register - CRUD Blog</title>
</head>

<body>

    <!-- Navigation -->
    <nav>
        <h2>✍️ CRUD Blog</h2>

        <div>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
        </div>
    </nav>


    <!-- Register Section -->
    <main class="container">

        <form id="registerForm">

            <h1>📝 Create Account</h1>

            <p class="subtitle" style="text-align:center; color:#64748b; margin-bottom:25px;">
                Join us and start writing your blogs
            </p>


            <!-- Name -->
            <label for="name">Name</label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your name"
                required
            >


            <!-- Email -->
            <label for="email">Email</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <!-- Password -->
            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Create a password"
                required
            >


            <!-- Register Button -->
            <button type="submit">
                Create Account
            </button>


            <!-- Message -->
            <p id="message"></p>


            <!-- Login Link -->
            <p style="text-align:center; margin-top:20px;">
                Already have an account?
                <a href="login.html"
                   style="color:#2563eb; font-weight:bold;">
                    Login
                </a>
            </p>

        </form>

    </main>


    <!-- Footer -->
    <footer>
        <p>© 2026 CRUD Blog | Full Stack Web Application</p>
    </footer>


    <!-- JavaScript -->
    <script src="auth.js"></script>

</body>

</html>
