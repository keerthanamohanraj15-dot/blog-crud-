<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <title>Login - CRUD Blog</title>
</head>

<body>

    <!-- Navigation -->
    <nav>
        <h2>✍️ CRUD Blog</h2>

        <div>
            <a href="index.html">Home</a>
            <a href="register.html">Register</a>
        </div>
    </nav>


    <!-- Login Section -->
    <main class="container">

        <form id="loginForm">

            <h1>🔐 Welcome Back</h1>

            <p class="subtitle">
                Login to manage your blog posts
            </p>

            <label for="email">Email</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >


            <button type="submit">
                Login
            </button>

            <p id="message"></p>

            <p style="text-align:center; margin-top:20px;">
                Don't have an account?
                <a href="register.html" style="color:#2563eb; font-weight:bold;">
                    Create Account
                </a>
            </p>

        </form>

    </main>


    <!-- Footer -->
    <footer>
        <p>© 2026 CRUD Blog | Full Stack Web Application</p>
    </footer>


    <!-- Existing Login JavaScript -->
    <script src="auth.js"></script>

</body>

</html>
